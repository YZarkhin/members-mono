name: Deploy Vite App to GitHub Pages

on:
  push:
    branches: ["main"] # Change to "master" if your default branch is master

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Install pnpm before setting up Node
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest # You can specify your exact pnpm version here (e.g., 8, 9, or 'latest')

      # 2. Set up Node and point the cache to pnpm
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      # 3. Install your monorepo dependencies using pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 4. Build your Vite app using pnpm
      - name: Build Web App
        run: |
          cd apps/web
          pnpm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './apps/web/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
